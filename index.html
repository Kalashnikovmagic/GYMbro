<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>GYMbro — прогресс</title>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div><p class="eyebrow">ЛИЧНЫЙ СПОРТИВНЫЙ АРХИВ</p><h1>GYM<span>bro</span></h1></div>
      <button class="icon-button" id="installBtn" title="Установить приложение" hidden>↓</button>
    </header>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab active" data-view="progress">Прогресс</button>
      <button class="tab" data-view="library">Техника</button>
    </nav>
    <section id="progress" class="view active"></section>
    <section id="library" class="view"></section>
  </main>
  <dialog id="videoDialog">
    <form method="dialog" id="videoForm">
      <div class="dialog-head"><div><p class="eyebrow">ВИДЕО ТЕХНИКИ</p><h2 id="videoTitle">Упражнение</h2></div><button type="button" class="close" aria-label="Закрыть">×</button></div>
      <input type="hidden" id="videoExerciseId">
      <label>Ссылка на YouTube<input id="videoUrl" type="url" placeholder="https://youtu.be/..."></label>
      <p class="form-hint">Вставьте ссылку на ролик — он появится прямо в карточке упражнения.</p>
      <button class="primary" value="default">Сохранить видео</button>
    </form>
  </dialog>
  <dialog id="recordDialog">
    <form method="dialog" id="recordForm">
      <div class="dialog-head"><div><p class="eyebrow">РЕЗУЛЬТАТ</p><h2 id="recordTitle">Новый вес</h2></div><button type="button" class="close" aria-label="Закрыть">×</button></div>
      <input type="hidden" id="recordId"><input type="hidden" id="recordExerciseId">
      <label>Вес, кг<input id="recordWeight" type="number" min="0" step="0.01" inputmode="decimal" required></label>
      <label>Дата<input id="recordDate" type="date" required></label>
      <label>Повторения <input id="recordReps" type="number" min="1" step="1" inputmode="numeric" placeholder="Необязательно"></label>
      <label>Заметка <input id="recordNote" maxlength="70" placeholder="Необязательно"></label>
      <button class="primary" value="default">Сохранить результат</button>
      <button class="danger" type="button" id="deleteRecord" hidden>Удалить результат</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
